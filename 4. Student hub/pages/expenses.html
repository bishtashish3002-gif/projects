<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Expense Tracker | Student Utility Hub</title><link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="../css/responsive.css"></head><body><header class="site-header"><nav class="nav wrap"><a class="brand" href="../index.html">🎓 Student Utility Hub</a><a class="button secondary" href="../index.html">← Home</a></nav></header><main><section class="page-hero"><div class="wrap"><span class="eyebrow">Finance</span><h1>Expense Tracker</h1><p>Record money in and out, then understand your balance.</p></div></section><section class="wrap tool-layout"><div><div class="panel"><div class="summary-grid"><div><small>Balance</small><strong id="balance">₹0</strong></div><div><small>Income</small><strong id="income">₹0</strong></div><div><small>Expenses</small><strong id="spent">₹0</strong></div></div></div><div class="panel"><h2>Add a record</h2><form id="expense-form" class="form-grid"><label class="field">Type<select id="record-type"><option value="expense">Expense</option><option value="income">Income</option></select></label><label class="field">Amount (₹)<input id="record-amount" type="number" min=".01" step=".01" required></label><label class="field">Category<input id="record-category" required placeholder="e.g. Food"></label><label class="field">Date<input id="record-date" type="date" required></label><label class="field full">Description<input id="record-description" placeholder="Optional note"></label><div class="field"><span>&nbsp;</span><button class="button primary">Add record</button></div></form></div></div><aside class="panel"><h3>Recent records</h3><ul id="expense-list" class="list"></ul></aside></section></main><div id="toast"></div><script src="../js/storage.js"></script><script src="../js/app.js"></script><script src="../js/expenses.js"></script></body></html>
