<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Attendance Calculator | Student Utility Hub</title><link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="../css/responsive.css"></head><body><header class="site-header"><nav class="nav wrap"><a class="brand" href="../index.html">🎓 Student Utility Hub</a><a class="button secondary" href="../index.html">← Home</a></nav></header><main><section class="page-hero"><div class="wrap"><span class="eyebrow">Academic</span><h1>Attendance Calculator</h1><p>Find your current attendance and plan your next classes.</p></div></section><section class="wrap tool-layout"><div class="panel"><h2>Your classes</h2><form id="attendance-form" class="form-grid"><label class="field">Total classes<input id="total" type="number" min="1" required placeholder="e.g. 60"></label><label class="field">Classes attended<input id="attended" type="number" min="0" required placeholder="e.g. 46"></label><label class="field">Required attendance (%)<input id="required" type="number" min="1" max="100" value="75" required></label><div class="field"><span>&nbsp;</span><button class="button primary">Calculate</button></div></form><div id="attendance-result" class="result" hidden></div></div><aside class="panel"><h3>How it works</h3><p class="hint">Enter your total and attended classes. The calculator tells you how close you are to your target.</p></aside></section></main><div id="toast"></div><script src="../js/storage.js"></script><script src="../js/app.js"></script><script src="../js/attendance.js"></script></body></html>
