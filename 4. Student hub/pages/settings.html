<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Settings | Student Utility Hub</title><link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="../css/responsive.css"></head><body><header class="site-header"><nav class="nav wrap"><a class="brand" href="../index.html">🎓 Student Utility Hub</a><a class="button secondary" href="../index.html">← Home</a></nav></header><main><section class="page-hero"><div class="wrap"><span class="eyebrow">Preferences</span><h1>Settings</h1><p>Make the hub feel right for you.</p></div></section><section class="wrap tool-layout"><div class="panel"><h2>Appearance and focus</h2><form id="settings-form" class="form-grid"><label class="field">Theme<select id="setting-theme"><option value="light">Light</option><option value="dark">Dark</option><option value="system">System</option></select></label><label class="field">Default focus duration (minutes)<input id="setting-focus" type="number" min="1" max="120" value="25"></label><label class="field">Default break (minutes)<input id="setting-break" type="number" min="1" max="60" value="5"></label><label class="field">Currency<input id="setting-currency" value="₹" maxlength="4"></label><div class="field"><span>&nbsp;</span><button class="button primary">Save settings</button></div></form></div><aside class="panel"><h3>Data</h3><p class="hint">Your data stays in this browser. Clearing it cannot be undone.</p><button id="clear-data" class="button secondary">Clear all saved data</button></aside></section></main><div id="toast"></div><script src="../js/storage.js"></script><script src="../js/app.js"></script><script src="../js/settings.js"></script></body></html>
