<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CGPA Calculator | Student Utility Hub</title><link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="../css/responsive.css"></head><body><header class="site-header"><nav class="nav wrap"><a class="brand" href="../index.html">🎓 Student Utility Hub</a><a class="button secondary" href="../index.html">← Home</a></nav></header><main><section class="page-hero"><div class="wrap"><span class="eyebrow">Academic</span><h1>CGPA Calculator</h1><p>Add each semester to calculate and save your overall CGPA.</p></div></section><section class="wrap tool-layout"><div class="panel"><h2>Add a semester</h2><form id="cgpa-form" class="form-grid"><label class="field">Semester<input id="semester" required placeholder="e.g. Semester 1"></label><label class="field">CGPA<input id="cgpa-value" type="number" min="0" max="10" step=".01" required placeholder="e.g. 7.8"></label><div class="field"><span>&nbsp;</span><button class="button primary">Add semester</button></div></form><ul id="semester-list" class="list"></ul></div><aside class="panel"><h3>Overall CGPA</h3><div class="result"><strong id="overall-cgpa">—</strong><span class="hint">Average of saved semesters</span></div></aside></section></main><div id="toast"></div><script src="../js/storage.js"></script><script src="../js/app.js"></script><script src="../js/cgpa.js"></script></body></html>
