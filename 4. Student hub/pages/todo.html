<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>To-do List | Student Utility Hub</title><link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="../css/responsive.css"></head><body><header class="site-header"><nav class="nav wrap"><a class="brand" href="../index.html">🎓 Student Utility Hub</a><a class="button secondary" href="../index.html">← Home</a></nav></header><main><section class="page-hero"><div class="wrap"><span class="eyebrow">Productivity</span><h1>To-do List</h1><p>Plan assignments, deadlines, and small wins.</p></div></section><section class="wrap tool-layout"><div class="panel"><h2>Add a task</h2><form id="task-form" class="form-grid"><label class="field full">Task<input id="task-name" required maxlength="100" placeholder="e.g. Complete DBMS assignment"></label><label class="field">Due date<input id="task-date" type="date"></label><label class="field">Priority<select id="task-priority"><option value="Medium">Medium</option><option value="High">High</option><option value="Low">Low</option></select></label><label class="field">Category<input id="task-category" placeholder="e.g. Study"></label><div class="field"><span>&nbsp;</span><button class="button primary">Add task</button></div></form></div><aside class="panel"><h3>Your tasks</h3><ul id="task-list" class="list"></ul></aside></section></main><div id="toast"></div><script src="../js/storage.js"></script><script src="../js/app.js"></script><script src="../js/todo.js"></script></body></html>
