<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pomodoro Timer | Student Utility Hub</title><link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="../css/responsive.css"></head><body><header class="site-header"><nav class="nav wrap"><a class="brand" href="../index.html">🎓 Student Utility Hub</a><a class="button secondary" href="../index.html">← Home</a></nav></header><main><section class="page-hero"><div class="wrap"><span class="eyebrow">Productivity</span><h1>Pomodoro Timer</h1><p>Work in focused sessions, then take a well-earned break.</p></div></section><section class="wrap tool-layout"><div class="panel"><p id="timer-mode" class="timer-label">Focus session</p><div id="timer" class="timer">25:00</div><div class="timer-controls"><button id="timer-start" class="button primary">Start</button><button id="timer-reset" class="button secondary">Reset</button></div></div><aside class="panel"><h3>Settings</h3><label class="field">Focus minutes<input id="focus-minutes" type="number" min="1" max="120" value="25"></label><label class="field">Break minutes<input id="break-minutes" type="number" min="1" max="60" value="5"></label><p class="hint">Completed focus sessions: <b id="completed-sessions">0</b></p></aside></section></main><div id="toast"></div><script src="../js/storage.js"></script><script src="../js/app.js"></script><script src="../js/pomodoro.js"></script></body></html>
